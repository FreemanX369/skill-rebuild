name: Test TIP-026R3 Runtime Forensics

on:
  push:
    branches: [ feat/tip026r3-mt5-runtime-forensics ]
    paths:
      - 'mt5-runtime-reconstruction/**'
      - '.github/workflows/test-tip026r3-runtime-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Python modules
        run: |
          python -m py_compile mt5-runtime-reconstruction/scripts/authority.py
          python -m py_compile mt5-runtime-reconstruction/scripts/compare_snapshots.py
          python -m py_compile mt5-runtime-reconstruction/scripts/scan_known_values.py
          python -m py_compile mt5-runtime-reconstruction/scripts/runtime_capture_windows.py
          python -m py_compile mt5-runtime-reconstruction/scripts/tunnel_adapter_reference.py
      - name: Unit and contract tests
        run: pytest -q mt5-runtime-reconstruction/tests
      - name: Write package provenance
        run: |
          printf 'REPOSITORY=FreemanX369/skill-rebuild\nHEAD=%s\nBRANCH=feat/tip026r3-mt5-runtime-forensics\nCI_RUN=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > TIP026R3-PROVENANCE.txt
      - name: Upload VPS package
        uses: actions/upload-artifact@v4
        with:
          name: TIP026R3-MT5-Runtime-Forensics
          retention-days: 30
          if-no-files-found: error
          path: |
            mt5-runtime-reconstruction
            .github/workflows/test-tip026r3-runtime-forensics.yml
            TIP026R3-PROVENANCE.txt

  windows-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Windows capture helper
        shell: pwsh
        run: |
          python -m py_compile mt5-runtime-reconstruction/scripts/runtime_capture_windows.py
          python -m py_compile mt5-runtime-reconstruction/scripts/authority.py
          python -m py_compile mt5-runtime-reconstruction/scripts/tunnel_adapter_reference.py
          python -m py_compile mt5-runtime-reconstruction/scripts/scan_known_values.py
      - name: Enforce no arbitrary target CLI
        shell: pwsh
        run: |
          $p='mt5-runtime-reconstruction/scripts/runtime_capture_windows.py'
          $text=Get-Content $p -Raw
          foreach($bad in @('add_argument("--pid"','add_argument("--process-name"','add_argument("--address"','add_argument("--command"')){
            if($text.Contains($bad)){ throw "Forbidden capture surface: $bad" }
          }
